name: 单次任务职责复核

on:
  push:
    branches: ['codex/architecture-clarity-20261110']
    paths:
      - 'src/MotionControl.TaskEngine.MachineDevice/TaskMachineOperations.cs'
      - 'tools/MotionControl.VirtualAdapter.Checks/Program.Commands.cs'
      - '.github/workflows/one-shot-command-refactor.yml'

# 迁移已完成：撤销写权限，仅用于本轮新增拒绝场景的红绿回归，随后删除。
permissions:
  contents: read

concurrency:
  group: one-shot-command-refactor
  cancel-in-progress: false

jobs:
  review-controller-commands:
    if: github.repository == 'hefan1/MotionControlFramework' && github.ref == 'refs/heads/codex/architecture-clarity-20261110'
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: 检出当前已提交源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 安装构建 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '8.0.x'
      - name: 核对职责与受保护布局
        shell: pwsh
        run: |
          python tools/Check-CommandBoundaries.py
          if ($LASTEXITCODE -ne 0) { throw '职责边界检查失败。' }
          ./tools/Verify-ProtectedUi.ps1
      - name: 实际软件控制器上的共享入口与失效拒绝回归
        shell: pwsh
        run: ./tools/Verify-ControllerApi.ps1
