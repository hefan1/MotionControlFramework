name: 任务装载关闭专项红绿验证

on:
  push:
    branches: ['codex/task-session-lifecycle-20261110']
    paths:
      - 'tools/Migrate-TaskSessionLifecycle.py'
      - 'tools/Apply-TaskSessionLifecycle.py'
      - 'src/MotionControl.Host.Wpf/Tasks/HostTaskSessionLoadOperation.cs'
      - '.github/workflows/session-lifecycle-refactor.yml'

# 单次迁移只提交固定隔离分支；全部验证成功后提交，不改主线，完成后移除此工作流。
permissions:
  contents: write

concurrency:
  group: task-session-lifecycle-refactor
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    if: github.repository == 'hefan1/MotionControlFramework' && github.ref == 'refs/heads/codex/task-session-lifecycle-20261110'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '8.0.x'
      - name: 增加回归并编译原生产实现
        shell: pwsh
        run: |
          python tools/Migrate-TaskSessionLifecycle.py --tests
          if ($LASTEXITCODE -ne 0) { throw '测试迁移失败。' }
          dotnet build tools/MotionControl.VirtualController/MotionControl.VirtualController.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw '软件控制器基础输出构建失败。' }
          dotnet build tools/MotionControl.OperatorPages.Checks/MotionControl.OperatorPages.Checks.csproj -c Release -p:Platform=x64 -o tmp/lifecycle-red
          if ($LASTEXITCODE -ne 0) { throw '编译失败，不能算作预期红灯。' }
      - name: 必须观察到原实现提前关闭
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & ./tmp/lifecycle-red/MotionControl.OperatorPages.Checks.exe '--pending-task-load' 2>&1 | Tee-Object -FilePath tmp/lifecycle-red.log
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $text = Get-Content tmp/lifecycle-red.log -Raw
          if ($code -eq 0 -or !$text.Contains('PENDING_LOAD_CLOSE_RETURNED_EARLY')) { throw '没有复现指定问题，不开始生产迁移。' }
          Write-Host '[RED 已确认] 原任务读取未结束时关闭提前成功。'
          exit 0
      - name: 迁移装载职责并要求专项回归成功
        shell: pwsh
        run: |
          python tools/Apply-TaskSessionLifecycle.py
          if ($LASTEXITCODE -ne 0) { throw '精确迁移或结构检查失败。' }
          dotnet build tools/MotionControl.OperatorPages.Checks/MotionControl.OperatorPages.Checks.csproj -c Release -p:Platform=x64 -o tmp/lifecycle-green
          if ($LASTEXITCODE -ne 0) { throw '迁移后编译失败。' }
          & ./tmp/lifecycle-green/MotionControl.OperatorPages.Checks.exe '--pending-task-load'
          if ($LASTEXITCODE -ne 0) { throw '在途关闭回归未通过。' }
      - name: 十个受保护文件与布局检查
        shell: pwsh
        run: |
          ./tools/Verify-ProtectedUi.ps1
          $pages = @('src/MotionControl.Framework.Wpf/Configuration/AxisMappingConfigurationView.xaml', 'src/MotionControl.Framework.Wpf/Configuration/IoMappingConfigurationView.xaml', 'src/MotionControl.Framework.Wpf/ManualDebug/ManualAxisControl.xaml', 'src/MotionControl.Framework.Wpf/ManualDebug/IoMonitorView.xaml', 'src/MotionControl.Host.Wpf/MainWindow.xaml')
          foreach ($page in $pages) {
            foreach ($path in @($page, "$page.cs")) {
              git diff --exit-code 18ab5a9857ab3542c86ff02b835ca30da0530e89 -- $path
              if ($LASTEXITCODE -ne 0) { throw "受保护文件变化：$path" }
            }
          }
          Write-Host '[通过] 十个受保护布局及后台文件未变化。'
      - name: 正式Host与全部内部检查
        shell: pwsh
        run: ./tools/Verify-V18.ps1
      - name: 实际单卡双卡及操作协调API回归
        shell: pwsh
        run: ./tools/Verify-ControllerApi.ps1
      - name: 仅提交已验证的本批文件并删除临时迁移脚本
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw '源码空白差异检查失败。' }
          git config user.name 'MotionControl Refactor'
          git config user.email 'motioncontrol-refactor@users.noreply.github.com'
          git rm -- tools/Migrate-TaskSessionLifecycle.py tools/Apply-TaskSessionLifecycle.py
          if ($LASTEXITCODE -ne 0) { throw '清理迁移脚本失败。' }
          git add -- src/MotionControl.Host.Wpf/Tasks/TaskMonitorLauncher.cs src/MotionControl.Host.Wpf/Tasks/HostTaskSessionLoadOperation.cs tools/Check-CommandBoundaries.py tools/MotionControl.OperatorPages.Checks/BoundTaskLoadChecks.cs tools/MotionControl.OperatorPages.Checks/PendingTaskLoadCloseChecks.cs tools/MotionControl.OperatorPages.Checks/Program.cs
          if ($LASTEXITCODE -ne 0) { throw '暂存本批文件失败。' }
          git diff --cached --stat
          git commit -m '重构：任务装载与失败回滚独立，关闭等待在途会话收尾' -m '先复现提前关闭问题，再验证普通关闭和上下文切换均等待原读取、禁止迟到发布并释放原持权。准备代次、关闭超时与重试保持原保护。五项结构、正式Host、全部内部检查及已有单/双控制器API通过；十个受保护文件不变，未合并master。'
          if ($LASTEXITCODE -ne 0) { throw '提交失败。' }
          git push origin HEAD:refs/heads/codex/task-session-lifecycle-20261110
          if ($LASTEXITCODE -ne 0) { throw '推送失败或分支被其他会话修改，禁止强推。' }
          git rev-parse HEAD
