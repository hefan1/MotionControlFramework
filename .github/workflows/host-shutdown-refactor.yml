name: Host退出专项红绿验证

on:
  push:
    branches: ['codex/host-shutdown-lifecycle-20261110']
    paths:
      - '.github/workflows/host-shutdown-refactor.yml'

permissions:
  contents: write

jobs:
  organize-and-verify:
    if: github.repository == 'hefan1/MotionControlFramework' && github.ref == 'refs/heads/codex/host-shutdown-lifecycle-20261110'
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '8.0.x'
      - name: 先确认退出事件仍混在启动文件
        shell: pwsh
        run: |
          python tools/Organize-HostShutdown.py --checks
          if ($LASTEXITCODE -ne 0) { throw '结构检查接线失败。' }
          $ErrorActionPreference = 'Continue'
          python tools/Check-CommandBoundaries.py 2>&1 | Tee-Object -FilePath structure-red.log
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($code -eq 0 -or !(Get-Content structure-red.log -Raw).Contains('EXIT_LIFECYCLE_NOT_SEPARATED')) { throw '未出现指定结构红灯。' }
          exit 0
      - name: 原样移动退出方法并验证构建与专项
        shell: pwsh
        run: |
          python tools/Organize-HostShutdown.py --move
          if ($LASTEXITCODE -ne 0) { throw '职责归位或结构检查失败。' }
          dotnet build tools/MotionControl.VirtualController/MotionControl.VirtualController.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw '软件控制器基础输出构建失败。' }
          dotnet build tools/MotionControl.OperatorPages.Checks/MotionControl.OperatorPages.Checks.csproj -c Release -p:Platform=x64 -o tmp/shutdown-organized
          if ($LASTEXITCODE -ne 0) { throw '迁移后构建失败。' }
          foreach ($case in @('--pending-task-load', '--shutdown-retry', '--host-shutdown')) {
            & ./tmp/shutdown-organized/MotionControl.OperatorPages.Checks.exe $case
            if ($LASTEXITCODE -ne 0) { throw "退出专项失败：$case" }
          }
      - name: 核对保护文件并提交明确文件
        shell: pwsh
        run: |
          ./tools/Verify-ProtectedUi.ps1
          $pages = @('src/MotionControl.Framework.Wpf/Configuration/AxisMappingConfigurationView.xaml', 'src/MotionControl.Framework.Wpf/Configuration/IoMappingConfigurationView.xaml', 'src/MotionControl.Framework.Wpf/ManualDebug/ManualAxisControl.xaml', 'src/MotionControl.Framework.Wpf/ManualDebug/IoMonitorView.xaml', 'src/MotionControl.Host.Wpf/MainWindow.xaml')
          foreach ($page in $pages) {
            foreach ($path in @($page, "$page.cs")) {
              git diff --exit-code e9912e32de74399e828c95e336a4a09f0514c8e2 -- $path
              if ($LASTEXITCODE -ne 0) { throw "受保护文件变化：$path" }
            }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw '源码差异存在空白错误。' }
          git config user.name 'MotionControl Refactor'
          git config user.email 'motioncontrol-refactor@users.noreply.github.com'
          git rm -- tools/Organize-HostShutdown.py
          if ($LASTEXITCODE -ne 0) { throw '临时脚本清理失败。' }
          git add -- src/MotionControl.Host.Wpf/App.xaml.cs src/MotionControl.Host.Wpf/App.Shutdown.cs tools/Check-CommandBoundaries.py
          if ($LASTEXITCODE -ne 0) { throw '暂存明确文件失败。' }
          git diff --cached --stat
          git commit -m '整理：关窗退出事件和字段集中到App.Shutdown.cs，保留已验证方法体' -m '设备协调仍由HostShutdownOperation负责，partial仅按职责归档同一个App，不增加运行层次。九项结构、Host编译和退出专项通过；受保护页面不变。'
          if ($LASTEXITCODE -ne 0) { throw '提交失败。' }
          git push origin HEAD:refs/heads/codex/host-shutdown-lifecycle-20261110
          if ($LASTEXITCODE -ne 0) { throw '分支变化或推送失败，禁止强推。' }
          git rev-parse HEAD
