name: Host退出专项红绿验证

on:
  push:
    branches: ['codex/host-shutdown-lifecycle-20261110']
    paths:
      - '.github/workflows/host-shutdown-refactor.yml'

permissions:
  contents: read

jobs:
  reproduce:
    if: github.repository == 'hefan1/MotionControlFramework' && github.ref == 'refs/heads/codex/host-shutdown-lifecycle-20261110'
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '8.0.x'
      - name: 只接线回归并编译原生产源码
        shell: pwsh
        run: |
          python tools/Wire-HostShutdownChecks.py
          if ($LASTEXITCODE -ne 0) { throw '测试接线失败。' }
          dotnet build tools/MotionControl.VirtualController/MotionControl.VirtualController.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw '软件控制器基础输出构建失败。' }
          dotnet build tools/MotionControl.OperatorPages.Checks/MotionControl.OperatorPages.Checks.csproj -c Release -p:Platform=x64 -o tmp/shutdown-red
          if ($LASTEXITCODE -ne 0) { throw '编译失败不算指定缺陷复现。' }
      - name: 核对三个准确失败原因
        shell: pwsh
        run: |
          $cases = @(
            @('--pending-task-load', 'PENDING_LOAD_CLOSE_RETURNED_EARLY'),
            @('--shutdown-retry', 'SHUTDOWN_RETRY_REENTERED_INVALID_OPERATION'),
            @('--host-shutdown', 'SHUTDOWN_OPERATION_MISSING')
          )
          foreach ($case in $cases) {
            $ErrorActionPreference = 'Continue'
            & ./tmp/shutdown-red/MotionControl.OperatorPages.Checks.exe $case[0] 2>&1 | Tee-Object -FilePath tmp/shutdown-red.log
            $code = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            $text = Get-Content tmp/shutdown-red.log -Raw
            if ($code -eq 0 -or !$text.Contains($case[1])) { throw "未观察到指定失败：$($case[1])" }
            Write-Host "[RED已确认] $($case[1])"
          }
          exit 0
